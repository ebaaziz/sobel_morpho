name: Continuous integration

on: 
  push:
  workflow_dispatch:

jobs:
  linux_build_and_execute:
    runs-on: ubuntu-latest
    steps:
    - name: Basculement sur l environnement de test github
      uses: actions/checkout@v5
      
    - name: Installation des dependances
      run: sudo apt-get upgrade && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev libsdl2-net-dev libsdl2-gfx-dev
    
    - name: Create a Build folder 
      run: cmake -B Build/
      
    - name: Build the project
      run: cmake --build Build/

    - name: executer le code
      run: ./Build/Release/sobel
      
  windows_build_and_execute:
    runs-on: windows-latest
    steps:
    - name: Basculement sur l environnement de test github
      uses: actions/checkout@v5
      
    - name: Installation des dependances
      run: vcpkg install sdl2 sdl2-image sdl2-ttf sdl2-mixer sdl2-net sdl2-gfx --triplet x64-windows
      
    - name: Create a Build folder 
      run: cmake -B Build/
      
    - name: Build the project
      run: cmake --build Build/

    - name: executer le code
      run: .\Build\Release\sobel.exe
