name: Continuous integration

on: 
  push:
  workflow_dispatch:

jobs:
  build_and_execute:
    runs-on: ubuntu-latest
    steps:
    - name: Basculement sur l environnement de test github
      uses: actions/checkout@v4
      
    - name: Installation des dependances
      run: sudo apt-get upgrade && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev libsdl2-net-dev libsdl2-gfx-dev
    
    - name: Create a Build folder 
      run: cmake -B Build/

    - name: executer le code
      run: ./Build/Release/sobel
